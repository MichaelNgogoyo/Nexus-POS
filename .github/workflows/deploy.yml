name: Deploy to VPS

on:
  workflow_dispatch:
    inputs:
      target_service:
        description: "Deploy stack: core (shared infra), backend, frontend, or all"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - core
          - frontend
          - backend
      deploy_minio:
        description: "Deploy MinIO as part of core stack"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  packages: write

env:
  # GitHub Actions secrets to add in the repository:
  # Settings -> Secrets and variables -> Actions
  VPS_HOST: ${{ secrets.VPS_HOST }} # Example: 31.97.116.56
  VPS_USER: ${{ secrets.VPS_USER }} # Example: michael
  VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }} # Contents of ~/.ssh/id_ed25519 (private key)
  VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }} # Optional fallback when password-based SSH is enabled
  APP_DOMAIN: nexuspos.apperstar.com
  IMAGE_NAME_FRONTEND: nexus-pos-frontend
  IMAGE_NAME_BACKEND: nexus-pos-backend
  IMAGE_NAME_MINIO: nexus-pos-minio
  TARGET_SERVICE: ${{ github.event.inputs.target_service || 'all' }}
  DEPLOY_MINIO: ${{ github.event.inputs.deploy_minio || 'false' }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate required deployment secrets
        run: |
          echo "Using GHCR identity: ${{ github.actor }}"
          if [ -z "${{ github.token }}" ]; then
            echo "GITHUB_TOKEN is unavailable in this workflow context."
            exit 1
          fi
          echo "GHCR token source: GITHUB_TOKEN"
          if [ -z "${{ secrets.VPS_HOST }}" ]; then
            echo "VPS_HOST is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "${{ secrets.VPS_USER }}" ]; then
            echo "VPS_USER is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "${{ secrets.VPS_SSH_PRIVATE_KEY }}" ]; then
            echo "VPS_SSH_PRIVATE_KEY is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        if: ${{ env.TARGET_SERVICE == 'all' || env.TARGET_SERVICE == 'frontend' }}
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker build \
            --build-arg VITE_API_BASE_URL="https://${{ env.APP_DOMAIN }}" \
            --build-arg VITE_KEYCLOAK_URL="https://${{ env.APP_DOMAIN }}/auth" \
            --build-arg VITE_KEYCLOAK_REALM="${{ secrets.KEYCLOAK_REALM || 'pos' }}" \
            --build-arg VITE_KEYCLOAK_CLIENT_ID="${{ secrets.KEYCLOAK_CLIENT_ID || 'pos-client' }}" \
            --build-arg VITE_REDIRECT_URI="https://${{ env.APP_DOMAIN }}" \
            -t ghcr.io/${OWNER_LC}/${{ env.IMAGE_NAME_FRONTEND }}:${{ github.sha }} \
            -f docker/Dockerfile.frontend .
          docker push ghcr.io/${OWNER_LC}/${{ env.IMAGE_NAME_FRONTEND }}:${{ github.sha }}

      - name: Build and push backend image
        if: ${{ env.TARGET_SERVICE == 'all' || env.TARGET_SERVICE == 'backend' }}
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker build -t ghcr.io/${OWNER_LC}/${{ env.IMAGE_NAME_BACKEND }}:${{ github.sha }} -f docker/Dockerfile.backend .
          docker push ghcr.io/${OWNER_LC}/${{ env.IMAGE_NAME_BACKEND }}:${{ github.sha }}

      - name: Mirror MinIO image to GHCR
        if: ${{ (env.TARGET_SERVICE == 'all' || env.TARGET_SERVICE == 'core') && env.DEPLOY_MINIO == 'true' }}
        run: |
          set -euo pipefail
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME || '' }}"
          DOCKERHUB_TOKEN="${{ secrets.DOCKERHUB_TOKEN || '' }}"
          MINIO_SOURCE_IMAGE_OVERRIDE="${{ secrets.MINIO_SOURCE_IMAGE || '' }}"

          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "$DOCKERHUB_TOKEN" | docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin >/dev/null 2>&1 || true
          fi

          HUB_TAGS_JSON="$(curl -fsSL "https://hub.docker.com/v2/repositories/minio/minio/tags?page_size=100" || true)"
          LATEST_RELEASE_TAG=""
          if [ -n "$HUB_TAGS_JSON" ]; then
            LATEST_RELEASE_TAG=$(printf '%s' "$HUB_TAGS_JSON" | grep -oE '"name"\s*:\s*"RELEASE\.[^"]+"' | head -n1 | sed -E 's/"name"\s*:\s*"([^"]+)"/\1/' || true)
          fi

          MINIO_SOURCE_CANDIDATES=""
          if [ -n "$MINIO_SOURCE_IMAGE_OVERRIDE" ]; then
            MINIO_SOURCE_CANDIDATES="$MINIO_SOURCE_IMAGE_OVERRIDE"
          fi
          if [ -n "$LATEST_RELEASE_TAG" ]; then
            MINIO_SOURCE_CANDIDATES="$MINIO_SOURCE_CANDIDATES docker.io/minio/minio:$LATEST_RELEASE_TAG quay.io/minio/minio:$LATEST_RELEASE_TAG"
          fi
          MINIO_SOURCE_CANDIDATES="$MINIO_SOURCE_CANDIDATES docker.io/minio/minio:RELEASE.2024-10-13T13-34-11Z quay.io/minio/minio:RELEASE.2024-10-13T13-34-11Z"

          if [ -z "$MINIO_SOURCE_CANDIDATES" ]; then
            echo "Unable to resolve a MinIO source image automatically."
            echo "Set MINIO_SOURCE_IMAGE secret to a known working image (for example docker.io/minio/minio:RELEASE.xxxxx)."
            exit 1
          fi

          MINIO_SOURCE_IMAGE=""
          for candidate in $MINIO_SOURCE_CANDIDATES; do
            echo "Trying MinIO source image on runner: ${candidate}"
            if docker pull "$candidate"; then
              MINIO_SOURCE_IMAGE="$candidate"
              break
            fi
          done

          if [ -z "$MINIO_SOURCE_IMAGE" ]; then
            echo "Failed to pull any MinIO source image candidate: $MINIO_SOURCE_CANDIDATES"
            exit 1
          fi

          GHCR_MINIO_IMAGE="ghcr.io/${OWNER_LC}/${{ env.IMAGE_NAME_MINIO }}:${{ github.sha }}"
          docker tag "${MINIO_SOURCE_IMAGE}" "${GHCR_MINIO_IMAGE}"
          docker push "${GHCR_MINIO_IMAGE}"

      - name: Verify SSH access to VPS
        shell: bash
        env:
          VPS_HOST: ${{ env.VPS_HOST }}
          VPS_USER: ${{ env.VPS_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ env.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          cat > /tmp/vps_key <<'EOF'
          ${{ env.VPS_SSH_PRIVATE_KEY }}
          EOF

          chmod 600 /tmp/vps_key

          if ! ssh-keygen -y -f /tmp/vps_key >/tmp/vps_key.pub 2>/dev/null; then
            echo "The provided VPS_SSH_PRIVATE_KEY is not a valid private key."
            exit 1
          fi

          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          if ! ssh -i /tmp/vps_key -o BatchMode=yes -o StrictHostKeyChecking=yes "${VPS_USER}@${VPS_HOST}" "echo SSH_OK"; then
            echo "SSH authentication failed. Add the following public key to /home/${VPS_USER}/.ssh/authorized_keys on the VPS:"
            cat /tmp/vps_key.pub
            exit 1
          fi

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.1
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ env.VPS_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            mkdir -p /opt/pos
            cd /opt/pos

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            export APP_DOMAIN="${{ env.APP_DOMAIN }}"
            if [ -z "$APP_DOMAIN" ]; then
              echo "APP_DOMAIN is required. Set APP_DOMAIN secret (e.g. nexuspos.apperstar.dev)."
              exit 1
            fi
            export DB_URL="jdbc:postgresql://pos-app-db:5432/pos_db"
            export DB_USERNAME="${{ secrets.DB_USERNAME || 'pos_user' }}"
            export DB_PASSWORD="${{ secrets.DB_PASSWORD || 'CHANGE_ME_IN_PRODUCTION' }}"
            export KEYCLOAK_REALM="${{ secrets.KEYCLOAK_REALM || 'pos' }}"
            export KEYCLOAK_ISSUER_URI="https://${APP_DOMAIN}/auth/realms/${KEYCLOAK_REALM}"
            export KEYCLOAK_CLIENT_ID="${{ secrets.KEYCLOAK_CLIENT_ID || 'pos-client' }}"
            export KEYCLOAK_CLIENT_SECRET="${{ secrets.KEYCLOAK_CLIENT_SECRET || 'CHANGE_ME_FROM_KEYCLOAK_ADMIN' }}"
            export KEYCLOAK_REDIRECT_URI="https://${APP_DOMAIN}"
            export MINIO_ENDPOINT="${{ secrets.MINIO_ENDPOINT || 'http://minio:9000' }}"
            export MINIO_ACCESS_KEY="${{ secrets.MINIO_ACCESS_KEY || 'minioadmin' }}"
            export MINIO_SECRET_KEY="${{ secrets.MINIO_SECRET_KEY || 'CHANGE_ME_IN_PRODUCTION' }}"
            export MINIO_BUCKET="${{ secrets.MINIO_BUCKET || 'product-images' }}"
            export CORS_ALLOWED_ORIGINS="${{ secrets.CORS_ALLOWED_ORIGINS || '' }}"
            if [ -z "$CORS_ALLOWED_ORIGINS" ]; then
              export CORS_ALLOWED_ORIGINS="https://${APP_DOMAIN}"
            fi
            export KEYCLOAK_ADMIN="${{ secrets.KEYCLOAK_ADMIN || 'admin' }}"
            export KEYCLOAK_ADMIN_PASSWORD="${{ secrets.KEYCLOAK_ADMIN_PASSWORD || 'CHANGE_ME_KEYCLOAK_ADMIN_PASSWORD' }}"
            export MINIO_ROOT_USER="${{ secrets.MINIO_ROOT_USER || 'minioadmin' }}"
            export MINIO_ROOT_PASSWORD="${{ secrets.MINIO_ROOT_PASSWORD || 'CHANGE_ME_MINIO_ROOT_PASSWORD' }}"
            export MINIO_IMAGE_OVERRIDE="${{ secrets.MINIO_IMAGE || '' }}"
            export DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME || '' }}"
            export DOCKERHUB_TOKEN="${{ secrets.DOCKERHUB_TOKEN || '' }}"
            export MINIO_GHCR_IMAGE="ghcr.io/${OWNER_LC}/${{ env.IMAGE_NAME_MINIO }}:${{ github.sha }}"
            export DEPLOY_MINIO="${{ env.DEPLOY_MINIO }}"
            export FRONTEND_PORT=3000
            export BACKEND_PORT=8081
            docker network inspect pos-shared >/dev/null 2>&1 || docker network create pos-shared
            if ! docker inspect -f '{{json .NetworkSettings.Networks}}' pos-postgres-1 | grep -q '"pos-shared"'; then
              docker network connect --alias pos-app-db pos-shared pos-postgres-1
            fi

            MINIO_IMAGE="${MINIO_IMAGE_OVERRIDE:-$MINIO_GHCR_IMAGE}"
            if [ "$DEPLOY_MINIO" = "true" ]; then
              if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
                echo "$DOCKERHUB_TOKEN" | docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin >/dev/null 2>&1 || true
              fi

              MINIO_CANDIDATES="$MINIO_IMAGE"
              if [ -n "$MINIO_IMAGE_OVERRIDE" ]; then
                MINIO_CANDIDATES="$MINIO_IMAGE_OVERRIDE $MINIO_GHCR_IMAGE"
              fi

              MINIO_IMAGE=""
              for candidate in $MINIO_CANDIDATES; do
                echo "Trying MinIO image: $candidate"
                if docker pull "$candidate" >/dev/null 2>&1; then
                  MINIO_IMAGE="$candidate"
                  break
                fi
              done

              if [ -z "$MINIO_IMAGE" ]; then
                echo "Failed to pull MinIO image from all candidates: $MINIO_CANDIDATES"
                echo "Set MINIO_IMAGE secret to a known working image in your environment."
                exit 1
              fi
              echo "Using MinIO image: $MINIO_IMAGE"
            else
              echo "DEPLOY_MINIO=false, skipping MinIO image pull checks."
            fi

            cat > docker-compose.core.yml <<YAML
            services:
              postgres:
                image: postgres:16-alpine
                environment:
                  POSTGRES_DB: pos_db
                  POSTGRES_USER: ${DB_USERNAME}
                  POSTGRES_PASSWORD: ${DB_PASSWORD}
                volumes:
                  - postgres-data:/var/lib/postgresql/data
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d pos_db"]
                  interval: 10s
                  timeout: 5s
                  retries: 10
                restart: always
                networks:
                  - pos-shared

              keycloak:
                image: quay.io/keycloak/keycloak:26.2
                command: start --http-enabled=true --proxy-headers=xforwarded --hostname-strict=false --http-relative-path=/auth
                environment:
                  KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
                  KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
                  KC_DB: postgres
                  KC_DB_URL: jdbc:postgresql://postgres:5432/pos_db
                  KC_DB_USERNAME: ${DB_USERNAME}
                  KC_DB_PASSWORD: ${DB_PASSWORD}
                depends_on:
                  postgres:
                    condition: service_healthy
                restart: always
                networks:
                  - pos-shared
                volumes:
                  - keycloak-data:/opt/keycloak/data

              minio:
                image: ${MINIO_IMAGE}
                profiles: ["minio"]
                command: server /data --console-address ":9001"
                environment:
                  MINIO_ROOT_USER: ${MINIO_ROOT_USER}
                  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
                restart: always
                networks:
                  - pos-shared
                volumes:
                  - minio-data:/data

            volumes:
              postgres-data:
              keycloak-data:
              minio-data:

            networks:
              pos-shared:
                external: true
            YAML

            cat > docker-compose.backend.yml <<YAML
            services:
              backend:
                image: ghcr.io/${OWNER_LC}/${{ env.IMAGE_NAME_BACKEND }}:${{ github.sha }}
                ports:
                  - "127.0.0.1:${BACKEND_PORT}:8080"
                environment:
                  SPRING_PROFILES_ACTIVE: "prod"
                  SERVER_PORT: "8080"
                  DB_URL: "${DB_URL}"
                  DB_USERNAME: "${DB_USERNAME}"
                  DB_PASSWORD: "${DB_PASSWORD}"
                  KEYCLOAK_ISSUER_URI: "${KEYCLOAK_ISSUER_URI}"
                  KEYCLOAK_CLIENT_ID: "${KEYCLOAK_CLIENT_ID}"
                  KEYCLOAK_CLIENT_SECRET: "${KEYCLOAK_CLIENT_SECRET}"
                  KEYCLOAK_REDIRECT_URI: "${KEYCLOAK_REDIRECT_URI}"
                  MINIO_ENDPOINT: "${MINIO_ENDPOINT}"
                  MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY}"
                  MINIO_SECRET_KEY: "${MINIO_SECRET_KEY}"
                  MINIO_BUCKET: "${MINIO_BUCKET}"
                  CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS}"
                restart: always
                networks:
                  - pos-shared

            networks:
              pos-shared:
                external: true
            YAML

            cat > docker-compose.frontend.yml <<YAML
            services:
              frontend:
                image: ghcr.io/${OWNER_LC}/${{ env.IMAGE_NAME_FRONTEND }}:${{ github.sha }}
                ports:
                  - "127.0.0.1:${FRONTEND_PORT}:80"
                environment:
                  VITE_API_BASE_URL: "https://${APP_DOMAIN}"
                  VITE_KEYCLOAK_URL: "https://${APP_DOMAIN}/auth"
                  VITE_KEYCLOAK_REALM: "${KEYCLOAK_REALM}"
                  VITE_KEYCLOAK_CLIENT_ID: "${KEYCLOAK_CLIENT_ID}"
                  VITE_REDIRECT_URI: "https://${APP_DOMAIN}"
                volumes:
                  - ./frontend-nginx.conf:/etc/nginx/conf.d/default.conf:ro
                restart: always
                networks:
                  - pos-shared

            networks:
              pos-shared:
                external: true
            YAML

            cat > frontend-nginx.conf <<'EOF'
            server {
              listen 80;
              server_name _;
              client_max_body_size 20m;

              location /api/ {
                proxy_pass http://backend:8080;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
              }

              location /auth/ {
                proxy_pass http://keycloak:8080/auth/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
              }

              location / {
                root /usr/share/nginx/html;
                index index.html;
                try_files $uri $uri/ /index.html;
              }
            }
            EOF

            CORE_PROFILE_ARGS=""
            if [ "$DEPLOY_MINIO" = "true" ]; then
              CORE_PROFILE_ARGS="--profile minio"
            fi

            case "${{ env.TARGET_SERVICE }}" in
              core)
                docker compose $CORE_PROFILE_ARGS -p pos-core -f docker-compose.core.yml up -d --remove-orphans
                ;;
              backend)
                docker compose -p pos-backend -f docker-compose.backend.yml pull backend
                docker compose -p pos-backend -f docker-compose.backend.yml up -d --remove-orphans backend
                ;;
              frontend)
                docker compose -p pos-frontend -f docker-compose.frontend.yml pull frontend
                docker compose -p pos-frontend -f docker-compose.frontend.yml up -d --remove-orphans frontend
                ;;
              all)
                docker compose $CORE_PROFILE_ARGS -p pos-core -f docker-compose.core.yml up -d --remove-orphans
                docker compose -p pos-backend -f docker-compose.backend.yml pull backend
                docker compose -p pos-backend -f docker-compose.backend.yml up -d --remove-orphans backend
                docker compose -p pos-frontend -f docker-compose.frontend.yml pull frontend
                docker compose -p pos-frontend -f docker-compose.frontend.yml up -d --remove-orphans frontend
                ;;
            esac
            docker ps
 